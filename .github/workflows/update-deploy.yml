name: Deploy heritage map to Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'web/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate heritage data
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('web/data/heritage.json'))
          items = d.get('items', [])
          n = len(items)
          withc = sum(1 for it in items if it.get('lat') is not None)
          print(f"items={n}, with_coords={withc}")
          if n < 30:
              print(f"::error::Too few items ({n}). Aborting deploy.")
              sys.exit(1)
          print("::notice::Data validation passed")
          PY

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r web/* site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4