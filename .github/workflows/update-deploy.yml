name: Update stores & deploy to Pages

on:
  schedule:
    # 毎週日曜 04:17 UTC (= 日本時間 日曜 13:17)。時刻は分散のため切の良い値を避ける
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "キャッシュを完全破棄して全件再取得（時間がかかります）"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は直前のものをキャンセル
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # クロールキャッシュを復元（詳細・座標の再利用で高速化）
      - name: Restore crawl cache
        uses: actions/cache@v4
        with:
          path: |
            crawl_cache.json
            fill_cache.json
          key: komeri-crawl-cache-${{ github.run_id }}
          restore-keys: |
            komeri-crawl-cache-

      - name: Full refresh (clear all caches)
        if: ${{ github.event.inputs.full_refresh == 'true' }}
        run: |
          rm -f crawl_cache.json fill_cache.json
          echo "::notice::Full refresh: all caches cleared"

      - name: Crawl all stores
        env:
          FRESH_DISCOVERY: "1"
        run: |
          python3 crawl_komeri.py
          python3 fix_names.py
          python3 fill_coords.py

      - name: Validate data (guard against blocked/partial crawl)
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('all_stores.json'))
          n = len(d)
          withc = sum(1 for s in d if s.get('lat') is not None)
          print(f"stores={n}, with_coords={withc}")
          if n < 1200:
              print(f"::error::Too few stores ({n} < 1200) — crawl likely blocked. Aborting deploy.")
              sys.exit(1)
          if withc < n * 0.9:
              print(f"::error::Coord coverage too low ({withc}/{n}). Aborting deploy.")
              sys.exit(1)
          print("::notice::Data validation passed")
          PY

      - name: Show summary
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          d=json.load(open('all_stores.json'))
          print(f"::notice::Total {len(d)} stores, {sum(1 for s in d if s.get('lat'))} with coords")
          for k,v in Counter(s['brand'] for s in d).most_common():
              print(f"  {k}: {v}")
          PY

      - name: Assemble site
        run: |
          mkdir -p site
          cp index.html styles.css app.js all_stores.json population.json site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # 次回実行用にキャッシュを保存（actions/cache は miss 時のみ保存するため、
      # 常に最新化するために run_id キーで保存させる → restore-keys で次回復元される）